# Blueprint de Render: crea el servicio web de la API.
# Usa una base PostgreSQL ya existente: al aplicar el Blueprint, Render pide
# pegar su "Internal Database URL" en DATABASE_URL (misma región: oregon).
services:
  - type: web
    name: capsule-corp-api-mc
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "false"
